[project]
name = "motion-tokens"
version = "0.1.0"
description = "Keyframe Tokens: where should a motion tokenizer spend its bits? Fixed-rate vs keyframe motion tokens at matched bitrate on LAFAN1."
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy", "scipy", "matplotlib", "tqdm"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
