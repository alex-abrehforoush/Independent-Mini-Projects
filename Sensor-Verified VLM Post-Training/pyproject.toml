[project]
name = "sensor-vlm"
version = "0.1.0"
description = "Sensor-verified post-training (SFT, GRPO, DPO) of a vision-language model that annotates hand-object interaction in egocentric video."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy",
    "scipy",
    "pillow",
    "tqdm",
    "trimesh",
    "huggingface_hub",
    "transformers>=5",
    "peft",
    "trl",
    "bitsandbytes",
    "accelerate",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
